[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantileflow"
version = "0.1.0"
description = "Bloques matemáticos de referencia para el seguimiento de distribuciones implícitas (versión de investigación)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["quantileflow"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
