# Copia de captura-hora.yml para la captura temprana (captura-temprana.yml), lanzada antes de las 9 de Nueva
# York: el job de las 09:45 espera el corte casi una hora en su máquina, más que los límites de captura-hora.yml
# (60 minutos el job y 45 la captura). Cambia solo eso: límites de 130 y 120 minutos y sin compuerta horaria,
# porque solo se lanza con workflow_dispatch. El plazo absoluto del script (60 s después del corte) sigue
# terminando la captura. Un cambio en captura-hora.yml va también aquí.
# Plantilla versionada en hectorcs23/QuantileFlow: ops/repo_datos/.github/workflows/
name: captura-hora-temprana

on:
  workflow_call:
    inputs:
      hora:
        description: "Hora de corte de Nueva York (HH:MM)"
        type: string
        required: true

permissions:
  contents: write

env:
  REPO_CODIGO: hectorcs23/QuantileFlow
  # Commit revisado del código de captura, fijo durante el piloto (verificado en reports/verificacion/<commit>.json).
  # Cambiarlo es cambiar la versión de medición; cada manifiesto registra el commit usado.
  REF_CODIGO: 4ffde8acda8c661b31d67e56dcde2dc0fb9c41f9

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      # Cada paso de preparación tiene su propio límite: un primer disparo atascado termina pronto y el respaldo
      # todavía llega al corte.
      - name: Código de captura
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_CODIGO }}
          ref: ${{ env.REF_CODIGO }}
          path: codigo

      - name: Datos
        timeout-minutes: 5
        uses: actions/checkout@v4
        with:
          path: datos

      - name: Python
        timeout-minutes: 5
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: codigo/requirements-bloqueo.txt

      - name: Dependencias
        timeout-minutes: 8
        run: pip install -r codigo/requirements-bloqueo.txt

      - name: Capturar
        # El script recupera primero las capturas interrumpidas de ejecuciones anteriores, espera hasta 5 s antes
        # del corte y se termina solo (código 3) si pasa el plazo absoluto (60 s después del corte).
        timeout-minutes: 120
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          ALPACA_PAPER: "true"
          HORA: ${{ inputs.hora }}
          DISPARO: ${{ github.event.schedule }}  # cron que disparó la corrida: mide el retraso del arranque
        run: python codigo/scripts/capturar_alpaca.py --datos datos --horas "$HORA"

      - name: Recuperar capturas interrumpidas
        # Si el paso anterior se cortó (plazo, límite de tiempo o cancelación), su diario se convierte aquí en un
        # manifiesto parcial o fallido con lo que llegó. No usa credenciales.
        if: always()
        timeout-minutes: 5
        run: python codigo/scripts/capturar_alpaca.py --datos datos --recuperar

      - name: Guardar el crudo
        # También tras una captura parcial: lo que llegó se conserva y el fallo queda en el paso de captura.
        if: always()
        timeout-minutes: 5
        working-directory: datos
        env:
          HORA: ${{ inputs.hora }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d raw ]; then echo "Sin crudo."; exit 0; fi
          git add raw
          if git diff --cached --quiet; then echo "Sin crudo nuevo."; exit 0; fi
          git commit -q -m "Captura de las $HORA del $(TZ=America/New_York date +%F) ($GITHUB_EVENT_NAME)"
          # Cada hora escribe archivos propios (o idénticos, direccionados por contenido): el rebase no choca.
          for intento in 1 2 3 4; do
            git push && exit 0
            sleep $((intento * 5))
            git pull -q --rebase
          done
          exit 1
