# Captura del corte de las 09:45 de Nueva York (hora principal del piloto).
# Se lanza con workflow_dispatch: de respaldo de captura-temprana.yml (rutinas de Claude de las 09:14 y las
# 09:32) o a mano. Sin cron desde el 6 de noviembre de 2026: los de GitHub llegaban horas tarde, la compuerta
# los descartaba y cada uno gastaba un minuto de Actions.
# Plantilla versionada en hectorcs23/QuantileFlow: ops/repo_datos/.github/workflows/
name: captura-0945

on:
  workflow_dispatch:
    inputs:
      ahora:
        description: "Captura inmediata de prueba (fuera de sesión usa el cierre anterior)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:  # el respaldo espera a que termine la corrida de esta hora y después no repite lo ya capturado
  group: captura-0945
  cancel-in-progress: false

jobs:
  capturar:
    uses: ./.github/workflows/captura-hora.yml
    with:
      hora: "09:45"
      ultimo_arranque: "0943"
      ahora: ${{ inputs.ahora == true }}
    secrets: inherit
