[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "btclab"
version = "0.1.0"
description = "Laboratorio de investigacion para mercados de prediccion de BTC (version de investigacion, sin ordenes reales)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["btclab"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
